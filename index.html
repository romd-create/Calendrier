<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tournée des calendriers</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calendriers">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#fff;--fg:#1c1b19;--mut:#6b6a66;--card:#f4f2ee;--line:#e2dfd8;--red:#c8281e;--ok:#2e7d4f;--re:#d98a00;--no:#7a7a7a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171615;--fg:#f1efe9;--mut:#a5a39c;--card:#232220;--line:#35332f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171615;--fg:#f1efe9;--mut:#a5a39c;--card:#232220;--line:#35332f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0 0 2px}
.sub{color:var(--mut);font-size:14px;margin-bottom:14px}
.stats{display:flex;gap:8px;margin-bottom:14px}
.stat{flex:1;background:var(--card);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--mut)}
.row{display:flex;gap:8px;align-items:center}
input{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-width:0;width:100%}
button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 14px;cursor:pointer}
.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:600;white-space:nowrap}
.card{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;margin-top:8px;padding:14px}
.card small{color:var(--mut)}
.chip{margin:12px 0 4px;font-size:14px;padding:8px 12px;border-radius:99px}
.chip.on{background:var(--re);border-color:var(--re);color:#fff}
.house{background:var(--card);border-radius:12px;margin-top:8px;padding:10px}
.house .top{display:flex;align-items:center;gap:6px}
.num{font-size:20px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.st{width:46px;height:46px;padding:0;font-size:20px;opacity:.4;background:var(--bg)}
.st.sel{opacity:1;border-width:2px}
.st.ok.sel{border-color:var(--ok)}.st.re.sel{border-color:var(--re)}.st.no.sel{border-color:var(--no)}
.more{width:38px;padding:0;height:46px;background:none;border:none;color:var(--mut)}
.det{margin-top:10px;display:grid;gap:8px}
.back{background:none;border:none;color:var(--red);padding:4px 0;font-weight:600}
.empty{color:var(--mut);text-align:center;margin:28px 0}
.foot{color:var(--mut);font-size:12px;text-align:center;margin-top:24px}
.danger{color:var(--red)}
.hint{color:var(--mut);font-size:13px;margin:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips .chip{margin:4px 0}
.hero{background:linear-gradient(135deg,#a3120c,#d9372a 55%,#f08a24);color:#fff;border-radius:20px;padding:20px 18px;margin-bottom:14px;box-shadow:0 6px 18px rgba(200,40,30,.28)}
.hero-t{font-size:23px;font-weight:800;letter-spacing:-.3px}.hero-s{opacity:.92;font-size:14px;margin-top:2px}
.stat:nth-child(1) b{color:var(--ok)}.stat:nth-child(2) b{color:var(--re)}.stat:nth-child(3) b{color:var(--red)}
.house{border-left:5px solid transparent}.house.s-ok{border-left-color:var(--ok)}.house.s-re{border-left-color:var(--re)}.house.s-no{border-left-color:var(--no)}
.sec{font-weight:700;margin:16px 0 2px;color:var(--red)}
.nav{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:10px;background:var(--bg);border:1px solid var(--line);text-decoration:none;font-size:20px}
.card{border-radius:14px}.primary{border-radius:12px;box-shadow:0 3px 10px rgba(200,40,30,.3)}
</style></head>
<body><main id="app"></main><input type="file" id="fr" accept=".json,application/json" hidden><input type="file" id="fi" accept=".csv,.gz,.txt,text/csv" hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const KEY="tournee-v1";
let S={streets:[]},view=null,filter=false,open=null,doc=null,adoc=null,saveT=null,A=null,near=null,msg="";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ST={ok:"✅",re:"🔁",no:"❌"};
function local(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function setSt(t){const e=$("#sync");if(e)e.textContent=t}
function save(){
  saveLocal();clearTimeout(saveT);
  saveT=setTimeout(async()=>{
    if(!doc){setSt("Enregistré sur ce téléphone");return}
    try{await doc.set({json:JSON.stringify(S)});setSt("Enregistré")}catch(e){setSt("Enregistré sur ce téléphone (non synchronisé)")}
  },500);
}
function amt(h){return parseFloat(String(h.amt||"0").replace(",","."))||0}
function totals(streets){
  let ok=0,re=0,all=0,sum=0;
  streets.forEach(s=>s.houses.forEach(h=>{all++;if(h.s==="ok")ok++;if(h.s==="re")re++;sum+=amt(h)}));
  return{ok,re,all,sum};
}
function fmt(n){return n.toLocaleString("fr-FR",{minimumFractionDigits:0,maximumFractionDigits:2})}
function sortH(s){s.houses.sort((a,b)=>{const x=parseInt(a.n)||0,y=parseInt(b.n)||0;return x-y||String(a.n).localeCompare(String(b.n))})}

function render(){
  const t=totals(S.streets);
  let h=`<div class="hero"><div class="hero-t">🚒 Tournée des calendriers</div><div class="hero-s">Sapeurs-pompiers · Secteur de Mauzac</div></div>
  <div class="stats"><div class="stat"><b>${t.ok}</b><span>remis</span></div>
  <div class="stat"><b>${t.re}</b><span>à repasser</span></div>
  <div class="stat"><b>${fmt(t.sum)} €</b><span>récolté</span></div></div>`;
  if(view==="todo"){h+=renderTodo()}
  else if(view==="map"){h+=`<button class="back" data-a="back">‹ Retour</button><div id="map" style="height:62vh;border-radius:12px;margin-top:8px"></div><div class="hint">🟢 fait / vendu · 🟠 à repasser · 🔴 refus. Touche un point pour voir la maison.</div>`}
  else if(view==="near"){h+=renderNear()}
  else if(view===null){
    h+=`<button class="primary" style="width:100%;margin-bottom:10px" data-a="goNear">📍 Autour de moi</button><button style="width:100%;margin-bottom:10px" data-a="pickList">📋 Choisir une rue dans la liste</button><button style="width:100%;margin-bottom:10px" data-a="goMap">🗺️ Carte de la tournée</button><button style="width:100%;margin-bottom:10px" data-a="goTodo">🔁 Repasses à faire (${t.re})</button>`;
    h+=`<div class="row"><input id="ns" placeholder="Ajouter une rue" autocomplete="off"><button class="primary" data-a="addStreet">Ajouter</button></div>`;
    h+=`<button class="chip ${filter?"on":""}" data-a="filter">🔁 À repasser seulement</button>`;
    let n=0;
    S.streets.forEach((s,i)=>{
      const c=totals([s]);
      if(filter&&!c.re)return;
      n++;
      h+=`<button class="card" data-a="openStreet" data-i="${i}"><span><b>${esc(s.name)}</b><br><small>${c.ok}/${c.all} remis${c.re?" · "+c.re+" à repasser":""}</small></span><span>›</span></button>`;
    });
    if(!n)h+=`<div class="empty">${filter?"Rien à repasser pour l’instant.":"Ajoute ta première rue pour commencer."}</div>`;
  }else{
    const s=S.streets[view];
    h+=`<button class="back" data-a="back">‹ Toutes les rues</button><h1 style="margin:6px 0 12px">${esc(s.name)}</h1>
    <div class="row"><input id="nh" placeholder="N° de maison (ex. 12 ou 12 bis)" autocomplete="off"><button class="primary" data-a="addHouse">Ajouter</button></div>
    <button class="chip ${filter?"on":""}" data-a="filter">🔁 À repasser seulement</button>`;
    let n=0;
    s.houses.forEach((x,j)=>{
      if(filter&&x.s!=="re")return;
      n++;
      const k=view+"-"+j,o=open===k;
      h+=`<div class="house s-${x.s||"n"}"><div class="top"><div class="num">${esc(x.n)}${x.note?" 📝":""}${x.amt?" 💶":""}</div>
      ${["ok","re","no"].map(c=>`<button class="st ${c} ${x.s===c?"sel":""}" data-a="setS" data-h="${j}" data-v="${c}">${ST[c]}</button>`).join("")}
      <button class="more" data-a="more" data-h="${j}">${o?"▴":"▾"}</button></div>
      ${o?`<div class="det"><input data-f="note" data-h="${j}" placeholder="Note (ex. repasser après 18h)" value="${esc(x.note||"")}">
      <input data-f="amt" data-h="${j}" inputmode="decimal" placeholder="Montant donné (€)" value="${esc(x.amt||"")}">
      <button class="danger" data-a="delHouse" data-h="${j}">Supprimer cette maison</button></div>`:""}</div>`;
    });
    if(!n)h+=`<div class="empty">${filter?"Rien à repasser dans cette rue.":"Aucune maison pour l’instant."}</div>`;
    h+=`<button class="danger" style="margin-top:20px;width:100%" data-a="delStreet">Supprimer cette rue</button>`;
  }
  if(view===null)h+=`<button style="width:100%;margin-top:16px" data-a="backup">💾 Sauvegarder mes données</button><button style="width:100%;margin-top:8px" data-a="restore">♻️ Restaurer une sauvegarde</button>`;
  if(view===null)h+=`<button style="width:100%;margin-top:8px" data-a="importAddr">📥 ${A?"Mettre à jour":"Importer"} les adresses de Mauzac</button>`;
  if(msg&&view!=="near")h+=`<div class="hint">${esc(msg)}</div>`;
  h+=`<div class="foot" id="sync"></div>`;
  $("#app").innerHTML=h;if(view==="map")drawMap();
}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a,h=+b.dataset.h;
  if(a==="backup"){try{const bl=new Blob([JSON.stringify(S)],{type:"application/json"}),u=URL.createObjectURL(bl),l=document.createElement("a");l.href=u;l.download="tournee-calendriers-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(l);l.click();l.remove();msg="Sauvegarde créée dans tes fichiers."}catch(e){msg="Sauvegarde impossible."}}
  else if(a==="restore"){$("#fr").click()}
  else if(a==="goMap"){view="map"}
  else if(a==="goTodo"){view="todo"}
  else if(a==="todoS"){S.streets[+b.dataset.i].houses[h].s=b.dataset.v;save()}
  else if(a==="pickList"){view="near";near={manual:true};msg=""}
  else if(a==="manualBack"){near.si=null}
  else if(a==="goNear"){view="near";near=null;msg="";if(A&&A.s.length)locate()}
  else if(a==="pickStreet"){near.si=+b.dataset.si}
  else if(a==="nearS"){const x=getH((near.A||A).s[+b.dataset.si].n,b.dataset.n,true);if(b.dataset.lo){x.lo=+b.dataset.lo;x.la=+b.dataset.la}x.s=x.s===b.dataset.v?"":b.dataset.v;save()}
  else if(a==="nearAdd"){const v=$("#nn").value.trim();if(v){getH((near.A||A).s[near.cur].n,v,true);save()}}
  else if(a==="importAddr"){$("#fi").click()}
  else if(a==="openStreet"){view=+b.dataset.i;open=null}
  else if(a==="back"){view=null;open=null}
  else if(a==="filter"){filter=!filter}
  else if(a==="addStreet"){
    const v=$("#ns").value.trim();if(!v)return;
    S.streets.push({name:v,houses:[]});
    S.streets.sort((x,y)=>x.name.localeCompare(y.name,"fr"));
    view=S.streets.findIndex(s=>s.name===v);open=null;save();
  }
  else if(a==="addHouse"){
    const v=$("#nh").value.trim();if(!v)return;
    const s=S.streets[view];
    if(!s.houses.some(x=>x.n.toLowerCase()===v.toLowerCase())){s.houses.push({n:v,s:"",note:"",amt:""});sortH(s);save()}
    open=null;
  }
  else if(a==="setS"){
    const x=S.streets[view].houses[h];x.s=x.s===b.dataset.v?"":b.dataset.v;save();
  }
  else if(a==="more"){const k=view+"-"+h;open=open===k?null:k}
  else if(a==="delHouse"){if(!confirm("Supprimer cette maison ?"))return;S.streets[view].houses.splice(h,1);open=null;save()}
  else if(a==="delStreet"){if(!confirm("Supprimer cette rue et toutes ses maisons ?"))return;S.streets.splice(view,1);view=null;open=null;save()}
  render();
});
document.addEventListener("change",e=>{
  const f=e.target.dataset&&e.target.dataset.f;if(!f)return;
  S.streets[view].houses[+e.target.dataset.h][f]=e.target.value.trim();
  save();render();
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter")return;
  if(e.target.id==="ns")document.querySelector('[data-a="addStreet"]').click();
  if(e.target.id==="nh")document.querySelector('[data-a="addHouse"]').click();
});

function getH(name,n,create){
  let s=S.streets.find(x=>x.name.toLowerCase()===name.toLowerCase());
  if(!s){if(!create)return null;s={name,houses:[]};S.streets.push(s);S.streets.sort((x,y)=>x.name.localeCompare(y.name,"fr"))}
  let h=s.houses.find(x=>String(x.n).toLowerCase()===String(n).toLowerCase());
  if(!h&&create){h={n:String(n),s:"",note:"",amt:""};s.houses.push(h);sortH(s)}
  return h||null;
}
function dist(a,b,c,d){const k=Math.PI/180;return Math.hypot((c-a)*Math.cos((b+d)/2*k),d-b)*111320}
function locate(){
  if(!navigator.geolocation){near={err:1};msg="Position indisponible sur cet appareil.";render();return}
  navigator.geolocation.getCurrentPosition(p=>{
      const lat=p.coords.latitude,lon=p.coords.longitude;near={lat,lon};
      let dm=1e9;if(A)A.s.forEach(s=>s.p.forEach(q=>{const d=dist(lon,lat,q[1],q[2]);if(d<dm)dm=d}));
      if(dm<300){render();return}
      near.loading=1;render();apiNear(lat,lon);
    },
    ()=>{near={err:1};msg="Position refusée ou indisponible. Autorise la localisation, puis réessaie.";render()},
    {enableHighAccuracy:true,timeout:15000,maximumAge:5000});
}
function renderNear(){
  let h=`<button class="back" data-a="back">‹ Retour</button><h1 style="margin:6px 0 8px">📍 Autour de moi</h1>`;
  if((!A||!A.s.length)&&!(near&&near.A))return h+`<div class="hint">Il manque la liste des adresses de Mauzac. Importe le fichier CSV de la commune (adresse.data.gouv.fr).</div><button class="primary" data-a="importAddr">📥 Importer le fichier</button><div class="hint">${esc(msg)}</div>`;
  if(!near||near.loading)return h+`<div class="empty">Localisation en cours…</div>`;
  if(near.err)return h+`<div class="hint">${esc(msg)}</div><button data-a="goNear">Réessayer</button><button style="width:100%;margin-top:10px" class="primary" data-a="pickList">📋 Choisir une rue dans la liste</button>`;
  if(near.manual&&near.si==null)return h+`<input id="q" placeholder="🔍 Chercher une rue…" autocomplete="off" style="margin-bottom:6px"><div id="list">`+A.s.map((s,si)=>`<button class="card" data-name="${esc(s.n)}" data-a="pickStreet" data-si="${si}"><b>${esc(s.n)}</b><small>${s.p.length} n°</small></button>`).join("")+`</div>`;
  const man=!!near.manual;
  const AA=near.A||A;
  const pts=[];
  if(!man)AA.s.forEach((s,si)=>s.p.forEach(q=>pts.push({si,d:dist(near.lon,near.lat,q[1],q[2])})));
  pts.sort((a,b)=>a.d-b.d);
  const sts=[];pts.slice(0,40).forEach(p=>{if(!sts.includes(p.si))sts.push(p.si)});
  const cur=near.si!=null?near.si:sts[0];near.cur=cur;
  const st=AA.s[cur];
  if(man)h+=`<button class="back" data-a="manualBack">‹ Changer de rue</button><h2 style="margin:0 0 8px">${esc(st.n)}</h2>`;
  h+=`<div class="chips">${sts.slice(0,5).map(si=>`<button class="chip ${si===cur?"on":""}" data-a="pickStreet" data-si="${si}">${esc(AA.s[si].n)}</button>`).join("")}</div>`;
  const rows=[],seen=new Set();
  st.p.map(q=>({n:String(q[0]),lo:q[1],la:q[2],d:man?null:dist(near.lon,near.lat,q[1],q[2])})).sort((a,b)=>man?(parseInt(a.n)-parseInt(b.n)||a.n.localeCompare(b.n)):a.d-b.d).forEach(r=>{const k=r.n.toLowerCase();if(!seen.has(k)){seen.add(k);rows.push(r)}});
  const top=rows.slice(0,man?300:14),tk=new Set(top.map(r=>r.n.toLowerCase()));
  const sx=S.streets.find(x=>x.name.toLowerCase()===st.n.toLowerCase());
  if(sx)sx.houses.forEach(x=>{const k=String(x.n).toLowerCase();if(!tk.has(k)){tk.add(k);const r=rows.find(r=>r.n.toLowerCase()===k);top.push({n:String(x.n),d:r?r.d:null})}});
  top.forEach(r=>{
    const x=getH(st.n,r.n,false),v=x?x.s:"";
    h+=`<div class="house s-${v||"n"}"><div class="top"><div class="num">${esc(r.n)} <small style="color:var(--mut);font-weight:400">${r.d==null?(man?"":"ajouté"):Math.round(r.d)+" m"}</small></div>${["ok","re","no"].map(c=>`<button class="st ${c} ${v===c?"sel":""}" data-a="nearS" data-si="${cur}" data-n="${esc(r.n)}" data-lo="${r.lo??""}" data-la="${r.la??""}" data-v="${c}">${ST[c]}</button>`).join("")}</div></div>`;
  });
  h+=`<div class="row" style="margin-top:14px"><input id="nn" placeholder="Numéro absent de la liste"><button class="primary" data-a="nearAdd">Ajouter</button></div><button style="width:100%;margin-top:10px" data-a="goNear">🔄 Actualiser ma position</button>`;
  return h;
}
async function readFile(f){
  if(/\.gz$/i.test(f.name)){
    if(!window.DecompressionStream)throw new Error("gz");
    return await new Response(f.stream().pipeThrough(new DecompressionStream("gzip"))).text();
  }
  return await f.text();
}
function parseBAN(t){
  const L=t.split(/\r?\n/),hd=L[0].replace(/"/g,"").split(";"),ix=(...k)=>{for(const x of k){const i=hd.indexOf(x);if(i>=0)return i}return -1};
  const iN=ix("numero"),iR=ix("rep","suffixe"),iV=ix("nom_voie","voie_nom","toponyme"),iX=ix("lon","long"),iY=ix("lat");
  if(iN<0||iV<0||iX<0||iY<0)throw new Error("format");
  const m={};let c=0;
  for(let i=1;i<L.length;i++){
    const r=L[i].replace(/"/g,"").split(";");
    const num=parseInt(r[iN]);if(!num||num>=9999)continue;
    const lon=parseFloat(r[iX]),lat=parseFloat(r[iY]),nom=(r[iV]||"").trim();
    if(!nom||isNaN(lon)||isNaN(lat))continue;
    const rep=iR>=0?(r[iR]||"").trim():"";
    (m[nom]=m[nom]||[]).push([num+(rep?" "+rep:""),+lon.toFixed(5),+lat.toFixed(5)]);c++;
  }
  if(!c)throw new Error("vide");
  return{s:Object.keys(m).sort((a,b)=>a.localeCompare(b,"fr")).map(n=>({n,p:m[n]})),c};
}
document.addEventListener("change",async e=>{
  if(e.target.id!=="fi")return;
  const f=e.target.files[0];if(!f)return;
  msg="Lecture du fichier…";render();
  try{
    A=parseAddr(await readFile(f));
    const j=JSON.stringify(A);
    try{localStorage.setItem("tournee-addr",j)}catch(x){}
    if(adoc){try{await adoc.set({json:j})}catch(x){}}
    msg=A.c+" adresses importées pour "+A.s.length+" voies.";
  }catch(x){msg="Fichier non reconnu ("+(x&&x.message||x)+"). Colonnes lues : "+LH}

function splitL(l,d){const o=[];let c="",q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(ch=='"'){if(q&&l[i+1]=='"'){c+='"';i++}else q=!q}else if(ch===d&&!q){o.push(c);c=""}else c+=ch}o.push(c);return o}
function parseAddr(t){
  t=t.replace(/^\uFEFF/,"");
  const L=t.split(/\r?\n/);
  LH=(L[0]||"").slice(0,150);
  const d=[";",",","\t"].map(x=>[x,(L[0]||"").split(x).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const hd=splitL(L[0]||"",d).map(s=>s.trim().toLowerCase());
  const ix=(...k)=>{for(const x of k){const i=hd.indexOf(x);if(i>=0)return i}return -1};
  const iN=ix("numero"),iR=ix("rep","suffixe"),iV=ix("nom_voie","voie_nom","toponyme"),iX=ix("lon","long","longitude"),iY=ix("lat","latitude");
  if(iN<0||iV<0||iX<0||iY<0)throw new Error("colonnes manquantes");
  const m={};let c=0;
  for(let i=1;i<L.length;i++){
    if(!L[i])continue;
    const r=splitL(L[i],d);
    const num=parseInt(r[iN]);if(!num||num>=9999)continue;
    const lon=parseFloat(String(r[iX]).replace(",",".")),lat=parseFloat(String(r[iY]).replace(",",".")),nom=(r[iV]||"").trim();
    if(!nom||isNaN(lon)||isNaN(lat))continue;
    const rep=iR>=0?(r[iR]||"").trim():"";
    (m[nom]=m[nom]||[]).push([num+(rep?" "+rep:""),+lon.toFixed(5),+lat.toFixed(5)]);c++;
  }
  if(!c)throw new Error("aucune adresse lisible");
  return{s:Object.keys(m).sort((a,b)=>a.localeCompare(b,"fr")).map(n=>({n,p:m[n]})),c};
}
const norm=s=>String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();

function renderTodo(){
  let h=`<button class="back" data-a="back">‹ Retour</button><h2 style="margin:4px 0 8px">🔁 Repasses à faire</h2>`,n=0;
  S.streets.forEach((s,i)=>{

    if(!L.length)return;
    h+=`<div class="sec">${esc(s.name)} <small>(${L.length})</small></div>`;
    L.forEach(([x,j])=>{

      h+=`<div class="house s-re"><div class="top"><div class="num">${esc(x.n)}${x.note?` <small style="color:var(--mut);font-weight:400">📝 ${esc(x.note)}</small>`:""}</div>${nav}<button class="st ok sel" data-a="todoS" data-i="${i}" data-h="${j}" data-v="ok">✅</button><button class="st no sel" data-a="todoS" data-i="${i}" data-h="${j}" data-v="no">❌</button></div></div>`;

}
async function apiNear(lat,lon){
  try{
    const r=await fetch("https://api-adresse.data.gouv.fr/reverse/?lon="+lon+"&lat="+lat+"&limit=15&type=housenumber");
    const j=await r.json(),m={};
    (j.features||[]).forEach(f=>{const p=f.properties,g=f.geometry.coordinates;if(!p.housenumber||!p.street)return;(m[p.street]=m[p.street]||[]).push([p.housenumber,g[0],g[1]])});
    const s=Object.keys(m).map(n=>({n,p:m[n]}));
    if(!s.length)throw 0;
    near={lat,lon,A:{s}};
  }catch(e){near={err:1};msg="Impossible de charger les adresses ici (réseau ?). Utilise la liste ou ajoute les numéros à la main."}
  render();
}

function drawMap(){
  const el=$("#map");
  if(!window.L){el.innerHTML='<div class="hint" style="padding:12px">Carte indisponible (pas de connexion).</div>';return}
  if(MAP){MAP.remove();MAP=null}
  MAP=L.map("map");
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(MAP);
  const col={ok:"#2e7d4f",re:"#e08a00",no:"#c8281e"},pts=[];let ch=false;
  S.streets.forEach(s=>s.houses.forEach(x=>{
    if(!x.s)return;
    if(x.lo==null&&A){const st=A.s.find(y=>y.n.toLowerCase()===s.name.toLowerCase()),q=st&&st.p.find(z=>String(z[0]).toLowerCase()===String(x.n).toLowerCase());if(q){x.lo=q[1];x.la=q[2];ch=true}}
    if(x.lo==null)return;
    L.circleMarker([x.la,x.lo],{radius:9,color:"#fff",weight:2,fillColor:col[x.s],fillOpacity:.95}).addTo(MAP).bindPopup("<b>"+esc(x.n)+" "+esc(s.name)+"</b>"+(x.note?"<br>"+esc(x.note):""));
    pts.push([x.la,x.lo]);
  }));
  if(ch)save();
  if(pts.length)MAP.fitBounds(pts,{padding:[30,30],maxZoom:18});else MAP.setView([43.376,1.292],14);
}

    render();setSt("Synchronisé avec ton compte");
  }catch(e){}
}
